name: DevPulse CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend Build & Test (.NET 9)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore DevPulse.sln

    - name: Build Solution
      run: dotnet build DevPulse.sln --no-restore --configuration Release

    - name: Run Unit & Integration Tests
      run: dotnet test DevPulse.sln --no-build --configuration Release --verbosity normal

  frontend-ci:
    name: Frontend Build & Test (React 19 + Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: npm ci

    - name: Run Vitest Suite
      run: npm run test

    - name: Build Production SPA Bundle
      run: npm run build
