services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DevPulseDb=Server=sqlserver;Database=DevPulseDb;User Id=sa;Password=DevPulseStrongPassword123!;TrustServerCertificate=True;
      - GitHub__Token=${GITHUB_TOKEN:-}
    depends_on:
      - sqlserver
      - redis
    networks:
      - devpulse-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - devpulse-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=DevPulseStrongPassword123!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - devpulse-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - devpulse-network

networks:
  devpulse-network:
    driver: bridge

volumes:
  sqlserver_data:
